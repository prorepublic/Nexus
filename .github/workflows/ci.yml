name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  control-plane:
    name: Control plane (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/control-plane
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_local_dev
          POSTGRES_DB: nexus
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Secret scan
        run: ./scripts/secret-scan.sh
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.28"
          enable-cache: true
          cache-dependency-glob: services/control-plane/uv.lock
      - name: Install dependencies
        run: uv sync --all-extras
      - name: Lint
        run: |
          uv run ruff check src tests
          uv run ruff format --check src tests
      - name: Type check
        run: uv run mypy src
      - name: Unit tests
        run: uv run pytest -m "not integration and not live" -q
      - name: Migrations apply cleanly
        run: uv run alembic upgrade head
      - name: Integration tests
        run: uv run pytest -m integration -q
      - name: Dependency audit
        run: uv run pip-audit --skip-editable || true

  web:
    name: Web dashboard (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high || true

# Notes:
# - No Claude or Codex execution ever happens in CI (tests marked "live" are
#   deselected and require explicit local invocation).
# - No deployment, no secrets consumed, least-privilege permissions.
